# RuConnect: one container with the RustDesk-compatible ID and relay servers,
# the client API and the web panel.
#
#   cp .env.example .env   # set RUCONNECT_ID_SERVER to this host's public address
#   docker compose up -d
#   docker compose logs ruconnect   # first start prints the generated admin password and the Key
#
# HTTPS (recommended when the panel is reachable from the internet):
#   set RUCONNECT_DOMAIN, RUCONNECT_LISTEN=127.0.0.1:21114 and RUCONNECT_TRUST_PROXY=true in .env, then
#   docker compose --profile https up -d
#
# Ports (host network): 21114/tcp API + panel (or 80/443 with HTTPS), 21115/tcp,
# 21116/tcp+udp ID server, 21117/tcp relay.
#
# Upgrading from the stock hbbs/hbbr containers: keep ./data. Its key is
# imported on first start, so clients keep working without changes.
services:
  ruconnect:
    image: ghcr.io/borisgb2001/ruconnect:latest
    build: .. # builds from source when the image is not available
    container_name: ruconnect-server
    network_mode: host
    env_file:
      - path: .env
        required: false
    volumes:
      - ruconnect-data:/data
      # Key of an earlier hbbs installation, imported once (read only).
      - ./data:/hbbs:ro
    restart: unless-stopped

  # Optional TLS front end with automatic Let's Encrypt certificates.
  caddy:
    image: caddy:2.11.7
    profiles: [https]
    container_name: ruconnect-caddy
    network_mode: host # 80/tcp, 443/tcp
    environment:
      RUCONNECT_DOMAIN: ${RUCONNECT_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - ruconnect
    restart: unless-stopped

volumes:
  ruconnect-data:
  caddy-data:
