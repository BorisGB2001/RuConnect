# RuConnect: RustDesk ID/relay servers (hbbs/hbbr, unmodified) + ruconnect (API and web panel).
#
#   cp .env.example .env   # set RUCONNECT_ID_SERVER to this host's public address
#   docker compose up -d
#   docker compose logs ruconnect   # first start prints the generated admin password
#
# Ports (host network): 21114 API + panel, 21115-21117 and 21118-21119 RustDesk.
services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: ruconnect-hbbs
    command: hbbs
    network_mode: host # 21115/tcp, 21116/tcp+udp, 21118/tcp
    volumes:
      - ./data:/root
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: ruconnect-hbbr
    command: hbbr
    network_mode: host # 21117/tcp, 21119/tcp
    volumes:
      - ./data:/root
    restart: unless-stopped

  ruconnect:
    image: ghcr.io/ruconnect/ruconnect:latest
    build: .. # builds from source when the image is not available
    container_name: ruconnect-server
    network_mode: host # 21114/tcp
    env_file:
      - path: .env
        required: false
    volumes:
      - ruconnect-data:/data
      - ./data:/hbbs:ro # hbbs public key (id_ed25519.pub), shown in the panel
    depends_on:
      - hbbs
    restart: unless-stopped

volumes:
  ruconnect-data:
